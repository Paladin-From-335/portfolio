<div class="selected-section">
  <h2>Ads</h2>
  <div class="selected-section__content">
    @for (project of projects; track project.videoUrl) {
      @if (project.videoUrl) {
        <app-youtube-video-preview
          [title]="project.title"
          [videoUrl]="project.videoUrl"
          [thumbnailUrl]="project.thumbnailUrl"
          variant="selected">
        </app-youtube-video-preview>
      }
    }
  </div>
  <a href="/projects" class="selected-section__button">View All Projects</a>
</div>
