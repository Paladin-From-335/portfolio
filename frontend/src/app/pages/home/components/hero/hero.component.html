<section class="hero">
  <iframe class="hero__video"
          [src]="heroVideoUrl"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
  </iframe>

  <div class="hero__overlay"></div>

  <div class="hero__content">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
    <a href="/projects" class="hero__button">
      View Projects
    </a>
  </div>
</section>
