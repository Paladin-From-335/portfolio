<div class="projects-container">
  @if (projectService.loading()) {
    <p role="status">Loading projects…</p>
  } @else if (projectService.error()) {
    <p role="alert">{{ projectService.error() }}</p>
    <button type="button" (click)="projectService.load()">Try again</button>
  } @else {
    <!-- Commercial videos section -->
    <app-expandable-section contentTitle="Commercial videos" variant="video">
      @for (project of commercialVideos(); track project.id) {
        <app-media-project-card [project]="project"></app-media-project-card>
      } @empty {
        <p>No commercial videos yet.</p>
      }
    </app-expandable-section>
    <!--  Commercial reels section-->
    <app-expandable-section contentTitle="Commercial reels" variant="reel">
      @if (reels().length) {
        <app-media-project-card [projectList]="reels()"></app-media-project-card>
      } @else {
        <p>No reels yet.</p>
      }
    </app-expandable-section>
    <!-- Non-commercial videos section -->
    <!--  Photo section-->
  }
</div>
