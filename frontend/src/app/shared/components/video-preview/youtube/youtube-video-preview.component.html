<div class="video-preview-wrapper"
     [class.video-preview-wrapper--selected]="previewVariant === 'selected'">
  <h3 class="video-title">{{ videoPreviewTitle }}</h3>
  <div class="video-preview">
    @if (!isPlaying()) {
      @if (thumbnailUrl) {
        <img [src]="thumbnailUrl" [alt]="videoPreviewTitle" class="landscape-frame video-thumbnail">
      } @else {
        <div class="landscape-frame video-thumbnail--fallback"></div>
      }
      <button class="play-button" type="button" (click)="play()" aria-label="Play video">
        <span>▶</span>
      </button>
    } @else {
      <iframe
        class="landscape-frame landscape-video"
        [src]="safeVideoUrl"
        [title]="videoPreviewTitle"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    }
  </div>
</div>
